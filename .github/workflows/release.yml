name: Release

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
  # Tag and publish the version on main by hand, e.g. after a bump PR was
  # merged by hand and the automatic path above never ran.
  workflow_dispatch:

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      mergeResult: ${{ steps.merge.outputs.mergeResult }}
      prLabels: ${{ steps.get_labels.outputs.labels }}
    permissions:
      pull-requests: write
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR labels
        id: get_labels
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              core.info("Could not find any pull requests in the workflow run.");
              core.setOutput("labels", "[]");
              return;
            }
            const prNumber = prs[0].number;
            core.info(`Found PR number: ${prNumber}`);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const labels = pr.labels.map(label => label.name);
            core.info(`Retrieved labels: ${labels}`);
            core.setOutput("labels", JSON.stringify(labels));

      - name: Debug labels output
        run: |
          echo "Labels output: ${{ steps.get_labels.outputs.labels }}"

      - name: Auto merge if auto-merge-ok label exists
        id: merge
        if: contains(fromJson(steps.get_labels.outputs.labels || '[]'), 'auto-merge-ok')
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: "auto-merge-ok"
          MERGE_METHOD: squash
          MERGE_DELETE_BRANCH: true

  tag-release:
    runs-on: ubuntu-latest
    needs: auto-merge
    # always(): on workflow_dispatch auto-merge is skipped, which would skip this job too.
    if: >-
      ${{ always() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (needs.auto-merge.outputs.mergeResult == 'merged' && contains(fromJson(needs.auto-merge.outputs.prLabels || '[]'), 'release'))
      ) }}
    permissions:
      contents: write  # push the release tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .

      - name: Get version from package
        id: get_version
        run: |
          VERSION=$(python -c "import rcb4; print(rcb4.__version__)")
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag and push release
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; not tagging again"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  pypi:
    name: Release To PyPi
    needs: tag-release
    if: ${{ always() && needs.tag-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build
      - name: Build
        run: |
          python -m build
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
